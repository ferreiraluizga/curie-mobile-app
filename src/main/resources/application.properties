spring.application.name=curieapp

# Configuração do datasource MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/curie?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

api.security.token.secret=my-secret-key-from-video
